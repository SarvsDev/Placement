<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <img id="photo" src="S_logo.png" width="500px" height="500px">
    <br>
    <button id="mybutton">Add Border</button>
    <button id="unclick">Remove Border</button>
</body>
<script>
    document.getElementById("mybutton").addEventListener("click",function(){
        const image = document.getElementById("photo")
        image.style.border= "4px solid red"
    })
    document.getElementById("unclick").addEventListener("click",function(){
        const image = document.getElementById("photo")
        image.style.border= "0px"
    })
</script>
</html>
