<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    p.none{
        border: none;
    }
    p.dotted{
        border: 2px dotted red;
    }
    p.dashed{
        border: 2px dashed green;
    }
    p.solid{
        border: 2px solid blue;
    }
    p.solid{
        border: 2px solid blue;
    }
    p.groove{
        border: 2px groove yellow;
    }
    p.double{
        border: 2px double black;
    }
    p.ridge{
        border: 2px ridge orange;
    }
    p.inset{
        border: 2px inset purple;
    }
    p.outset{
        border: 2px outset pink;
    }
    p.hidden{
        border: 2px hidden brown;
    }
</style>
<body>
    <p class="none">No border</p>
    <p class="dotted">Dotted border</p>
    <p class="dashed">Dashed border</p>
    <p class="solid">Solid border</p>
    <p class="groove">Groove border</p>
    <p class="double">Double border</p>
    <p class="ridge">Ridge border</p>
    <p class="inset">Inset border</p>
    <p class="outset">Outset border</p>
    <p class="hidden">Hidden border</p>
</body>
</html>
