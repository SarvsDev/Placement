<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<link rel="stylesheet" href="style.css">
<body>
    <p>This is a paragraph</p>
    <h1>My first Css Example</h1>
    <p id="myParagraph">This is a paragraph</p>
    <p id="anotherParagraph">This is another paragraph</p>
    <h1 class="myHeading">My Second CSS Example</h1>
    <h1 style="border: 10px solid tomato;">My Third CSS Example</h1>
    <h1 style="border: 2px solid white; color: blue;">My Fourth CSS Example</h1>
    <div class="myDiv">
        <p>This is a paragraph inside a div</p>
    </div>
    <div>
        This is a div without a class or id
    </div>
</body>
</html>
